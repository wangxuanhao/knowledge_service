name: knowledge-service-postgres

services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: knowledge-postgres
    restart: unless-stopped
    shm_size: 256mb
    env_file:
      - .env.postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - knowledge_postgres_data:/var/lib/postgresql
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - password_encryption=scram-sha-256
      - -c
      - wal_compression=on
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=200
      - -c
      - idle_in_transaction_session_timeout=60000
      - -c
      - timezone=Asia/Shanghai
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true

volumes:
  knowledge_postgres_data:
    name: knowledge-postgres-data

