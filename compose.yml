name: knowledge-service

services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: knowledge-postgres
    restart: unless-stopped
    shm_size: 256mb
    env_file:
      - .env.postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - knowledge_postgres_data:/var/lib/postgresql
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - password_encryption=scram-sha-256
      - -c
      - wal_compression=on
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=200
      - -c
      - idle_in_transaction_session_timeout=60000
      - -c
      - timezone=Asia/Shanghai
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true

  etcd:
    image: quay.io/coreos/etcd:v3.5.33
    container_name: knowledge-etcd
    restart: unless-stopped
    command:
      - /usr/local/bin/etcd
      - --name=default
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://127.0.0.1:2380
      - --initial-advertise-peer-urls=http://localhost:2380
      - --initial-cluster=default=http://localhost:2380
      - --quota-backend-bytes=4294967296
      - --auto-compaction-mode=revision
      - --auto-compaction-retention=1000
    ports:
      - "127.0.0.1:2379:2379"
    volumes:
      - type: bind
        source: ../milvus/volumes/milvus/etcd
        target: /etcd-data
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/etcdctl
        - --endpoints=http://127.0.0.1:2379
        - endpoint
        - health
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 60s

  milvus:
    image: milvusdb/milvus:v3.0.2
    container_name: milvus-standalone
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    environment:
      DEPLOY_MODE: STANDALONE
      ETCD_ENDPOINTS: etcd:2379
      COMMON_STORAGETYPE: local
    command:
      - milvus
      - run
      - standalone
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - type: bind
        source: ../milvus/volumes/milvus
        target: /var/lib/milvus
        bind:
          create_host_path: false
      - type: bind
        source: ../milvus/volumes/milvus/etcd
        target: /var/lib/milvus/etcd
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../milvus/user.yaml
        target: /milvus/configs/user.yaml
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:9091/healthz
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s
    stop_grace_period: 60s
    depends_on:
      etcd:
        condition: service_healthy
        restart: true

  attu:
    image: zilliz/attu:v3.0.0-beta.6
    container_name: attu
    restart: unless-stopped
    environment:
      MILVUS_ADDRESS: milvus:19530
    ports:
      - "3000:3000"
    depends_on:
      milvus:
        condition: service_healthy

volumes:
  knowledge_postgres_data:
    name: knowledge-postgres-data

