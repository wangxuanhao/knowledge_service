<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">一个实体的多个属性值如何阅读</title><desc id="desc">概念示意，非产品截图。图谱用实体和关系表达关联，属性在详情按字段分组展示，每值携带来源和时间，冲突单独复核。</desc>
<rect width="1200" height="800" rx="20" fill="#f5f7f4"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif" fill="#183e36">
<text x="48" y="50" font-size="15" letter-spacing="2">属性阅读 · 概念示意，非产品截图</text><text x="48" y="96" font-size="32" font-weight="700">一个平台，多项属性；每个值都有自己的依据</text>
<rect x="48" y="140" width="396" height="590" rx="14" fill="white" stroke="#ccdad3"/>
<text x="76" y="180" font-size="22" font-weight="700">图谱 / 脑图</text>
<path d="M240 280V393" stroke="#8aa398" stroke-width="3"/><text x="256" y="348" font-size="18" fill="#526b64">发布</text>
<rect x="104" y="215" width="270" height="66" rx="33" fill="#1e584a"/><text x="239" y="257" text-anchor="middle" font-size="24" fill="white">青禾平台</text>
<rect x="104" y="394" width="270" height="66" rx="33" fill="#e6efdf"/><text x="239" y="435" text-anchor="middle" font-size="22">商户服务规则</text>
<text x="76" y="515" font-size="18" font-weight="700">悬浮：快速看摘要</text><text x="76" y="551" font-size="17" fill="#526b64">属性项数、值数、少量预览</text>
<text x="76" y="604" font-size="18" font-weight="700">点击：打开详情核对</text><text x="76" y="640" font-size="17" fill="#526b64">不为段落和数字画属性连线</text>
<rect x="480" y="140" width="672" height="590" rx="14" fill="white" stroke="#ccdad3"/>
<text x="508" y="180" font-size="22" font-weight="700">实体详情：按属性定义分组</text>
<rect x="508" y="207" width="616" height="208" rx="10" fill="#eef4ee"/>
<text x="530" y="239" font-size="20" font-weight="700">服务地区 · 允许多值</text>
<text x="530" y="280" font-size="21">值 1：华东</text><text x="530" y="311" font-size="17" fill="#526b64">文档 A、B 支撑 · 各条来源时间可分别核对</text>
<path d="M530 332H1102" stroke="#ccdad3"/>
<text x="530" y="363" font-size="21">值 2：华南</text><text x="530" y="394" font-size="17" fill="#526b64">文档 C 支撑 · 2026 年 4 月起适用</text>
<rect x="508" y="433" width="616" height="156" rx="10" fill="#eef4ee"/>
<text x="530" y="465" font-size="20" font-weight="700">平台职责 · 段落值</text><text x="530" y="504" font-size="19">负责商户准入与服务治理，受理申诉……</text><text x="530" y="536" font-size="17" fill="#526b64">展开全文 → 查看来源 → 核对范围和时间</text><text x="530" y="567" font-size="16" fill="#526b64">不同段落值分别列出，不拼接成无来源的大段文字</text>
<rect x="508" y="607" width="616" height="96" rx="10" fill="#fff2dd"/>
<text x="530" y="641" font-size="20" font-weight="700" fill="#805b20">单值冲突：待复核</text><text x="530" y="678" font-size="17" fill="#805b20">查看完整集合和证据 → 逐值接受 / 拒绝，或修正期间</text>
<text x="48" y="774" font-size="17" fill="#526b64">本体定义说明「能填什么」；实例属性说明「这个对象的值是什么、来自哪里、何时适用」。</text>
</g></svg>
