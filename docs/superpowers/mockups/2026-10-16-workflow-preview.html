function countRaw(raw){try{const f=JSON.parse(raw);const count=x=>!x?0:Array.isArray(x.and)?x.and.reduce((s,v)=>s+count(v),0):Array.isArray(x.or)?x.or.reduce((s,v)=>s+count(v),0):x.field?1:0;return count(f);}catch{return 0;}}

function rawMatches(doc,condition){if(!condition)return true;if(Array.isArray(condition.and))return condition.and.every(c=>rawMatches(doc,c));if(Array.isArray(condition.or))return condition.or.some(c=>rawMatches(doc,c));const value={'metadata.region.city':doc.city,'metadata.applicability.platforms':doc.platform,'valid_from':doc.valid,'valid_until':doc.until,'kind':'document'}[condition.field];const want=condition.value;switch(condition.op){case'eq':return value===want;case'ne':return value!==want;case'contains':return String(value||'').includes(String(want));case'exists':return value!==undefined&&value!=='';case'in':return Array.isArray(want)&&want.includes(value);case'gte':return value>=want;case'lte':return value<=want;default:return false;}}

 };

function documentDialog(id,tab){const d=documents.find(x=>x.id===id)||documents[0];const tabs=['原文','提取知识','处理记录','修订记录'];let body=`<div class="row">${badge(d.platform,d.platform==='待确认'?'warn':'')}${badge('文档修订 r'+d.revision)}${badge(d.state==='failed'?'解析失败':'原文可用',d.state==='failed'?'bad':'good')}</div><div class="underline-tabs spaced">${tabs.map(t=>`<button data-act="doc-tab" data-doc="${d.id}" data-tab="${t}" class="${tab===t?'active':''}">${t}</button>`).join('')}</div>`;if(tab==='原文')body+=`<dl class="detail-meta"><dt>处理用途</dt><dd>${d.ontology==='未启用'?'仅文档检索':'图谱增强'}</dd><dt>知识状态</dt><dd>${d.knowledge}</dd><dt>本体依据</dt><dd>${d.ontology.startsWith('v')?'本体 '+d.ontology+' · 本次处理固定':d.ontology}</dd><dt>有效时间</dt><dd>${d.valid||'尚未确认'}${d.until?' 至 '+d.until:d.valid?' 起，结束时间未设':''}</dd></dl>${d.state==='failed'?'<div class="callout bad">未识别到可用正文。请核对扫描质量和解析能力后重试。</div>':`<article class="document-text"><h3>${esc(d.name.replace(/\.[^.]+$/,''))}</h3><p class="muted small">示例资料 · 用于演示引用定位</p><p>一、适用范围<br>本条款针对文档已标明的适用对象。</p><p><mark>二、申请材料<br>申请信息、交易凭证和情况说明应与具体条款的适用条件一同核对。</mark></p><p>三、补充说明<br>示例内容不代表任何真实平台政策。实际结论需要查阅真实文档及其有效期。</p></article>`}`;else if(tab==='提取知识')body+=d.state==='review'?'<div class="callout warn">8 项候选待确认，合格原文可以独立用于文档说明。</div><div class="mini-list"><div><span>入驻申请 · 候选实体</span><button class="link" data-act="draft">处理候选 →</button></div><div><span>提交资料 · 候选关系</span><button class="link" data-act="draft">处理候选 →</button></div></div>':`<p class="muted small">按来源断言查看本次文档支持的知识。</p><div class="mini-list"><div><span>退款申请 · 实体</span><button class="link" data-act="fact-detail" data-fact="退款申请">修订 r1 · 本体 v3 →</button></div><div><span>申请商户 → 退款申请</span><button class="link" data-act="fact-detail" data-fact="提交关系">修订 r1 · 本体 v3 →</button></div></div>`;else if(tab==='处理记录')body+=`<div class="timeline-item"><span class="revision-tag">14:12</span><div><h3>受控抽取 · 本体 v3</h3><p>输入：文档修订 r2 · 实体/关系已确认</p><button class="link small" data-act="version-relations">查看本次依据与产物   const variants=[

    ['semantic','向量基线','固定编码器、相同证据范围','已有检索'],
    ['hybrid','混合检索基线','词法与向量融合，不加图上下文','已有检索'],

  function quality(){
    const head=`<div class="maint-tabs" aria-label="评测类型"><button data-act="maint-quality-tab" data-tab="extraction" class="${m.quality==='extraction'?'active':''}">抽取质量</button><button data-act="maint-quality-tab" data-tab="ablation" class="${m.quality==='ablation'?'active':''}">检索与问答消融</button></div>`;

  function ablation(){
    if(m.ablationView==='report')return ablationReport();
    return `<div class="ablation-head"><div><h2>${esc(m.experiment)}</h2><p>固定资料与问题，一次改变一个能力，核对证据与回答差异。</p></div><button data-act="maint-ablation-new">新建实验配置</button></div><div class="ablation-status">执行后端待接通。本页展示实验配置与报告结构，当前没有真实实验指标。</div><div class="ablation-freeze"><div><small>资料 / 本体</small><span>来源固定修订 · 本体 v4</span></div><div><small>索引 / 编码器</small><span>g12 · 相同编码器配置</span></div><div><small>问题 / 范围</small><span>固定 3 问 · 显式平台与时点</span></div><div><small>生成模型</small><span>各组固定相同模型与 prompt</span></div><div><small>预算</small><span>相同 top-k 与上下文预算</span></div><div><small>测量条件</small><span>记录缓存冷热、延迟与用量</span></div></div><div class="surface"><div class="ablation-panel-title"><h3>选择对照组</h3><span class="muted small">能力状态与实验状态分别记录</span></div><div class="table-wrap"><table class="ablation-table"><thead><tr><th>对照组</th><th>真正改变的环节</th><th>接入状况</th></tr></thead><tbody>${variants.map(([id,name,description,availability])=>`<tr class="${id==='community'?'ablation-disabled':''}"><td><label class="ablation-checkbox"><input type="checkbox" data-maint-variant="${id}" ${m.variants.has(id)?'checked':''} ${id==='community'?'disabled':''}>${name}</label></td><td>${description}</td><td>${badge(availability,id==='community'?'':id==='keyword'||id==='semantic'||id==='hybrid'?'good':'warn')}</td></tr>`).join('')}</tbody></table></div><div class="row between spaced"><p class="muted small">关闭图谱需停止图证据读取和入模，画布显隐不参与实验。</p><button class="primary" data-act="maint-ablation-report">预览报告结构 →</button></div></div><p class="note spaced">融合/消歧前后对照使用隔离的实验派生图，不撤销生产融合记录；先完成查询侧对照，再接构建侧实验。</p>`;

  function ablationReport(){
    const selected=variants.filter(([id])=>m.variants.has(id));
    return `<div class="ablation-head"><div><button class="link small" data-act="maint-ablation-back">← 返回实验配置</button><h2 style="margin-top:9px">对照报告 · 尚未运行</h2><p>${esc(m.experiment)}</p></div>${badge('报告结构预览','warn')}</div><div class="ablation-report"><section class="surface"><h3>证据、质量与开销</h3><p class="muted small">没有实测或标注时保留“待测”，不记成 0 或满分。</p><div class="table-wrap spaced"><table class="ablation-table" aria-label="消融报告结构"><thead><tr><th>对照组</th><th>证据 Recall@k</th><th>引用支持性</th><th>范围 / 时点</th><th>P50 / P95</th><th>用量 / 成本</th></tr></thead><tbody>${selected.map(([,name])=>`<tr><td>${name}</td><td class="ablation-metric-pending">待标注 / 运行</td><td class="ablation-metric-pending">待核对</td><td class="ablation-metric-pending">待核对</td><td class="ablation-metric-pending">待测</td><td class="ablation-metric-pending">待收据</td></tr>`).join('')}</tbody></table></div></section><section class="surface"><h3>逐问题配对核对</h3>${['退款申请需要哪些材料？','平台 A 与平台 B 的条款有哪些差异？','历史资料能否支持当前规则结论？'].map((question,i)=>`<div class="ablation-case"><div class="row between"><span>${i+1}. ${question}</span><button class="link small" data-act="maint-ablation-case" data-question="${question}">看逐组证据 →</button></div><p>命中来源与修订 / 实际策略 / 答案与引用 / 错误或拒答原因</p></div>`).join('')}</section><p class="note">每组都记录真实执行和降级情况；失去权限或被撤回的来源不会因为旧 manifest 而继续暴露。</p></div>`;
  }
  function recordOperation(type,label,detail,before){
    const expected=before?Object.fromEntries(before.map(v=>[v.id,entity(v.id)?.revision])):null;
    m.operations.unshift({type,label,detail,before,expected,undone:false});
  }
  function revise(e,apply,type='编辑实体',detail='保存为新知识修订'){
    const before=clone(e);apply();e.revision++;recordOperation(type,e.name,detail,[before]);
  }
  function handleAction(act,b){

    if(!editable()||base.id!==versions[0].id)return {ok:false,message:'请先进入基于当前发布的可编辑草案。'};
    if(fingerprint!==JSON.stringify(draft))return {ok:false,message:'草案已变化，请重新核对父类建议。'};
    const child=cls(childId,draft),parent=cls(parentId,draft);
    if(!child||!parent||childId===parentId)return {ok:false,message:'请选择不同且有效的父类和子类。'};
    if(child.parents.includes(parentId))return {ok:false,message:'已有这条继承关系，不重复添加。'};
    const previous=[...child.parents];child.parents.push(parentId);
    const cycle=localChecks().some(x=>x.message.includes('继承环'));child.parents=previous;

    if(candidate.kind==='relation'&&(!cls(candidate.from,draft)||!cls(candidate.to,draft)))return {ok:false,message:'请先定义关系的起点和终点类型。'};
    if(candidate.kind==='attribute'&&!cls(candidate.owner,draft))return {ok:false,message:'请先定义属性的所属类。'};

    });

    return {ok:true};
  }

  function selectProject(id,page='sources'){

  function finish(message){closeDialog(false);render();toast(message+'（本地演示）。');}
  function confirmAction(data){openDialog('mg-confirm',data);}
  function handleAction(act,el){
    if(act==='manage-projects'){navigate('projects');return true;}
    if(act==='switch-project'){selectProject(el.dataset.project,el.dataset.project==='main'?'qa':'sources');return true;}
    if(act==='delete-project'){openDialog('mg-project',{id:state.project});return true;}
    if(act==='save-settings'){openDialog('mg-project',{id:state.project});return true;}
    if(!act.startsWith('mg-'))return false;
    const id=el.dataset.id,d=state.dialog,p=projectById(id),u=personById(id);
    switch(act.slice(3)){
      case'open-projects':navigate('projects');break;
      case'new-project':openDialog('mg-new-project');break;
      case'project-detail':if(p)openDialog('mg-project',{id});break;
      case'enter-project':selectProject(id);break;
      case'project-overview':selectProject(id,'overview');break;
      case'project-backups':selectProject(id,'backups');break;
      case'clear-projects':local.projectQuery='';render();break;
      case'clear-people':local.personQuery='';local.role='all';local.status='all';render();break;
      case'save-new-project':case'save-project':{
        const name=$('mg-project-name').value.trim();if(!name){showError('请填写项目名称。');break;}
        if(act==='mg-save-new-project'){const item={id:'project-'+local.sequence++,name};projects.push(item);local.projectQuery='';selectProject(item.id);toast('示例项目已创建，下一步添加资料（本地演示）。');}
        else{const target=projectById(d.id);if(!target)break;target.name=name;if(target.id===state.project)state.projectName=name;finish('项目名称已更新');}break;
      }
      case'delete-project':if(p)confirmAction({operation:'delete-project',id,title:'删除项目？',subtitle:p.name,message:`将删除“${p.name}”及其资料与知识。草图仅删除本地示例；正式操作不可恢复。`,confirmName:p.name,button:'删除项目'});break;
      case'new-person':openDialog('mg-new-person');break;
      case'person-detail':if(canEdit(u))openDialog('mg-person',{id});break;
      case'save-new-person':{
        const username=$('mg-username').value.trim(),password=$('mg-password').value,role=$('mg-person-role').value;
        if(!username){showError('请填写登录账号。');break;}
        if(people.some(x=>x.username===username)){showError('该登录账号已存在。');break;}
        if(password.length<6||password.length>128){showError('口令需要 6–128 个字符。');break;}
        if(!['viewer','admin'].includes(role)){showError('当前管理员不能授予这个角色。');break;}
        people.push({id:'person-'+local.sequence++,username,display_name:$('mg-display-name').value.trim(),role,is_active:true});
        local.personQuery='';local.role='all';local.status='all';finish('账号已添加');break;
      }
      case'save-person':{
        const target=personById(d.id),role=$('mg-person-role').value;if(!canEdit(target))break;
        if(!['viewer','admin'].includes(role)||(target.id==='self'&&role!==target.role)){showError('不能更改当前账号的角色或授予最高权限。');break;}
        const display=$('mg-display-name').value.trim();
        if(target.role!==role&&role==='viewer'){confirmAction({operation:'save-person',id:target.id,role,display,title:'将该账号设为只读？',subtitle:target.username,message:'更改后将不能写入知识、管理项目或管理账号。',button:'确认降为只读'});break;}
        target.display_name=display;target.role=role;finish('人员信息已更新');break;
      }
      case'toggle-person':if(canRemove(u)){if(u.is_active)confirmAction({operation:'disable-person',id,title:'停用账号？',subtitle:u.username,message:'停用后无法登录，已有会话失效；账号与历史保留。',button:'确认停用'});else{u.is_active=true;finish('账号已启用');}}break;
      case'delete-person':if(canRemove(u))confirmAction({operation:'delete-person',id,title:'删除账号？',subtitle:u.username,message:'此操作物理删除账号并释放登录名，无法恢复。只需暂停使用时可选择停用。',confirmName:u.username,button:'删除账号'});break;
      case'reset-password':if(canRemove(u))openDialog('mg-reset-password',{id});break;
      case'save-password':if(canRemove(personById(d.id))){const password=$('mg-password').value;if(password.length<6||password.length>128){showError('口令需要 6–128 个字符。');break;}if(password!==$('mg-password-confirm').value){showError('两次输入的口令不一致。');break;}finish('已演示口令重置，未更改真实账号');}break;
      case'confirm':{
        if(d.confirmName&&$('mg-confirm-name').value!==d.confirmName){showError('输入内容与确认名称不一致。');break;}
        if(d.operation==='delete-project'){
          const target=projectById(d.id);if(!target)break;projects.splice(projects.indexOf(target),1);
          if(state.project===d.id){const next=projects[0];state.project=next?.id||'__none__';state.projectName=next?.name||'未选择项目';state.messages=[];}
          for(const k of Object.keys(state.filters))if(k.startsWith(d.id+':'))delete state.filters[k];
          closeDialog(false);navigate('projects');toast('示例项目已删除（本地演示）。');break;
        }
        const target=personById(d.id);if(!canRemove(target))break;
        if(d.operation==='disable-person')target.is_active=false;
        if(d.operation==='delete-person')people.splice(people.indexOf(target),1);
        if(d.operation==='save-person'){target.role=d.role;target.display_name=d.display;}
        finish('账号更改已确认');break;
      }
    }
    return true;
  }
  function handleChange(el){
    const field=el.dataset.mgField;if(!field||!Object.hasOwn(local,field))return false;
    local[field]=el.value;refreshResults();return true;
  }
  function install(){
    titles.projects=['管理','项目管理','集中管理项目，进入各自的资料与知识工作空间。'];
    titles.people=['管理','人员管理','管理系统账号、角色和登录状态。'];
    const previous=render;
    render=function(){
      if(!projectById(state.project)&&!isManagement())state.page='projects';
      if(isManagement()){
        renderNav();$('breadcrumb').textContent='工作空间 / 管理';$('page-title').textContent=titles[state.page][1];$('page-subtitle').textContent=titles[state.page][2];
        $('heading-actions').innerHTML=state.page==='projects'?btn('new-project','＋ 创建项目','','primary'):btn('new-person','＋ 添加人员','','primary');
        state.filterOpen=false;renderFilter();$('page-content').innerHTML=state.page==='projects'?renderProjects():renderPeople();
      }else previous();
      managementNav();if(!projectById(state.project))$('nav').innerHTML='';
    };
    renderSettings=function(){return `<div class="surface mg-current-settings"><h3>${esc(state.projectName)}</h3><p class="muted">项目名称、备份入口和删除操作集中在项目设置抽屉中。</p>${btn('project-detail','打开项目设置',`data-id="${esc(state.project)}"`,'primary')}${btn('open-projects','返回项目管理','','ghost')}</div>`;};
    projectMenu=function(){const menu=$('project-menu'),opened=menu.hidden;menu.hidden=!opened;$('project-trigger').setAttribute('aria-expanded',String(opened));menu.innerHTML=`<small class="mg-menu-label">快速切换项目</small>${projects.map(p=>`<button data-act="switch-project" data-project="${esc(p.id)}">${p.id===state.project?'✓ ':''}${esc(p.name)}</button>`).join('')}${projectById(state.project)?'<hr><button data-act="nav" data-page="overview">当前项目概览</button><button data-act="nav" data-page="backups">知识备份</button>':''}<hr><button data-act="manage-projects">全部项目与管理 →</button>`;};
    if(['#projects','#people'].includes(location.hash))state.page=location.hash.slice(1);
  }
  return {install,renderDialog,handleAction,handleChange};
})();

// END MANAGEMENT MODULE
// BEGIN PREVIEW EXTENSIONS
renderRecords=maintenanceUI.renderRecords;
renderQuality=maintenanceUI.renderQuality;
const previousOntologyRenderer=renderOntology;
renderOntology=function(){return typeof studioUI!=='undefined'&&hasOntology()?studioUI.render():previousOntologyRenderer();};
const previousDialogRenderer=drawDialog;
drawDialog=function(){
  if(!state.dialog)return;
  const studioMarkup=managementUI.renderDialog(state.dialog)??discoveryBridge.renderDialog(state.dialog)??(typeof studioUI!=='undefined'?studioUI.renderDialog(state.dialog):null);
  const markup=studioMarkup??maintenanceUI.renderDialog(state.dialog);
  if(markup===null){previousDialogRenderer();return;}
  $('dialog-host').innerHTML=markup;
  requestAnimationFrame(()=>{$('dialog-host').querySelector('button,input,select,textarea')?.focus();});
};
const previousPageRenderer=render;
render=function(){previousPageRenderer();if(state.page==='ontology'&&typeof studioUI!=='undefined'&&hasOntology())$('heading-actions').innerHTML='';discoveryBridge.augment();};
document.addEventListener('click',event=>{
  const button=event.target.closest('[data-act]');if(!button)return;
  const act=button.dataset.act;
  const consumed=managementUI.handleAction(act,button)||discoveryBridge.handleAction(act,button)||(typeof studioUI!=='undefined'&&studioUI.handleAction(act,button))||maintenanceUI.handleAction(act,button);
  if(consumed){event.preventDefault();event.stopImmediatePropagation();}
},true);
document.addEventListener('change',event=>{
  const consumed=managementUI.handleChange(event.target)||discoveryBridge.handleChange(event.target)||(typeof studioUI!=='undefined'&&studioUI.handleChange(event.target))||maintenanceUI.handleChange(event.target);
  if(consumed)event.stopImmediatePropagation();
},true);
document.addEventListener('input',event=>{if(managementUI.handleChange(event.target)||(typeof studioUI!=='undefined'&&studioUI.handleChange(event.target))||maintenanceUI.handleInput(event.target))event.stopImmediatePropagation();},true);
if(typeof studioUI!=='undefined')studioUI.install();
discoveryBridge.install();
managementUI.install();
// END PREVIEW EXTENSIONS

render();
})();
</script>
