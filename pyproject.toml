[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-service"
version = "1.1.0"
description = "Project-scoped bitemporal knowledge, ontology and metadata-first retrieval service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "numpy>=2,<3", "faiss-cpu>=1.9,<2", "rdflib>=7,<8", "pyshacl>=0.30,<1",
  "httpx>=0.27,<1", "python-multipart>=0.0.18", "python-dotenv>=1,<2"
]

[project.optional-dependencies]
neo4j = ["neo4j>=6,<7"]
local = ["sentence-transformers>=3,<7"]
semantica-runtime = ["PyYAML>=6", "networkx>=3", "rich>=13", "tqdm>=4", "requests>=2", "python-dateutil>=2.9", "openai>=1,<4"]
test = ["pytest>=8,<10"]

[project.scripts]
knowledge-service = "knowledge_service.__main__:main"

[tool.setuptools.packages.find]
include = ["knowledge_service*"]

[tool.setuptools.package-data]
knowledge_service = ["web/*.html", "web/*.css", "web/*.js", "resources/*.ttl"]

[tool.pytest.ini_options]
testpaths = ["tests/service"]
