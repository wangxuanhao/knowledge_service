[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-service"
version = "1.1.0"
description = "Project-scoped bitemporal knowledge, ontology and metadata-first retrieval service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "numpy>=2,<3", "rdflib>=7,<8", "pyshacl>=0.30,<1",
  "httpx>=0.27,<1", "python-multipart>=0.0.18", "python-dotenv>=1,<2",
  "psycopg[binary]>=3.2,<4", "psycopg_pool>=3.2,<4"
]

[project.optional-dependencies]
neo4j = ["neo4j>=6,<7"]
milvus = ["pymilvus>=3.0,<4"]
local = ["sentence-transformers>=3,<7"]
semantica-runtime = [
  "semantica[parse-docling]>=0.7,<0.8", "docling>=2.130,<3",
  "PyYAML>=6", "networkx>=3", "rich>=13", "tqdm>=4", "requests>=2",
  "python-dateutil>=2.9", "openai>=1,<4"
]
test = ["pytest>=8,<10", "playwright>=1.50,<2"]

[project.scripts]
knowledge-service = "knowledge_service.__main__:main"

[tool.setuptools.packages.find]
include = ["knowledge_service*"]

[tool.setuptools.package-data]
# 迁移 SQL 必须随包分发：源码目录之外安装 wheel 后也要能执行迁移（规划 §5.1）
knowledge_service = [
  "web/*.html", "web/*.css", "web/*.js", "web/vendor/*.js", "resources/*.ttl",
  "repository/migrations/*.sql",
]

[tool.pytest.ini_options]
testpaths = ["tests/service"]
